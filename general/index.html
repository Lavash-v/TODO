<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family-TODO-List</title>
    <style>
    /* Стили, общие св-ва */
    @font-face {
        font-family: 'Inter';
        src: url('../fonts/Inter-VariableFont_opsz,wght.ttf') format('truetype');
        font-weight: 100 900;
        font-style: normal;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: 'Inter';
        font-size: 16px;
    }

    body {
        background-color: #1A1A1A;
        color: #FFFFFF;
        height: 100vh;
        opacity: 0;
        transition: opacity 0.15s ease-in;
    }

    body.ready {
        opacity: 1;
    }

    /* Главный контейнер страницы регистарции/входа */
    .main-container_welcome-page,
    .main-container_welcome-back-page {
        display: flex;
        height: 100vh;
        width: 100%;
    }

    /* Контейнер левой части с картинкой */
    .container-image_green-blur-lights {
        position: relative;
        width: 60%;
        height: 100%;
        display: inline-block;
    }

    .container-image_green-blur-lights img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        padding: 20px; 
    }

    /* Форма */
    .container-form_registration {
        flex-direction: column;
        gap: 20px;
        width: 40%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 120px;
    }

    .container-text-registration {
        text-align: center;
        display: flex;
        flex-direction: column;
        gap: 20px;
        margin-bottom: 92px;
    }
 
    .container-form_registration form {
        width: 100%;
        max-width: 554px;
        display: flex;
        flex-direction: column;
        gap: 56px;
    }

    /* Поля формы */
    .enter-username,
    .create-password,
    .enter-invitation-code {
        display: flex;
        flex-direction: column;
        width: 100%;
        margin-bottom: 10px;
    }

    label {
        margin-bottom: 20px;
    }
    
    input,
    textarea {
        width: 100%;
        padding: 18.5px 24px;
        box-sizing: border-box;
        border: none;
        border-radius: 8px;
        background-color: #323232;
        color: #FFFFFF;
        font-weight: 400;
        transition: opacity 0.3s ease, box-shadow 0.3s ease;
    }

    input:hover {
        opacity: 0.8;
    }

    input::placeholder,
    textarea::placeholder {
        color: #A8A8A8;
        font-weight: 400;
    } 

    input:focus,
    textarea:focus {
        outline: none;

    }

    input:user-invalid {
        border: 1px solid #FF0000;
        outline: none;
        box-shadow: 0 0 10px rgba(255, 0, 0, 1);
    }

    input:user-invalid::placeholder {
        color: #FF0000;
    }

    input:focus,
    textarea:focus {
        outline: none;
        border: 1px solid #84D431;
        box-shadow: 0 0 10px rgba(132, 212, 49, 1);
    }

    input:focus::placeholder {
        color: #A8A8A8;
    }



    /* Кнопка регистрации */
    .button_register {
        background: none;
        border: none;
        font-size: 16;
        font-weight: 600;
    }

    .button_register:hover{
        opacity: 0.8;
        box-shadow: 0 0 10px rgba(132, 212, 49, 1);
    }

    .link-reg {
        text-align: center;
        border-radius: 8px;
        padding: 24px 0;
        border: none;
        background-color: #84D431;
        font-weight: 600;
        margin-top: 67px;
        color: #1A1A1A;

        transition: opacity 0.3s ease, box-shadow 0.3s ease;
        cursor: pointer;
    }

    .text-link_if-have-acc {
        margin-right: auto;
        width: 100%;
        margin-top: -8px;
    }

    .link_log-in {
        color: #84D431;
    }

    .link_log-in:hover {
        text-decoration: none;
    }

    .container-text_welcome {
        position: absolute;
        z-index: 1;
        margin-left: 120px;
        bottom: 0;
        flex-direction: column;
        gap: 32px;
        display: flex;
        margin-bottom: 216px;
    }
    </style>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            document.body.classList.add('ready');
        });
    </script>
</head>
<body>
    <div class="main-container_welcome-page" id="auth-card">
        <div class="container-image_green-blur-lights">
            <div class="container-text_welcome">
                <div class="text-welcome" style="font-size: 56px; font-weight: 600;" id="left-title">Добро пожаловать!</div>
                <div class="subtext-register-to-enter" style="font-size: 24px;" id="left-subtitle">Зарегистрируйтесь, чтобы продолжить</div>
            </div>
            <img src="../components/welcome_bg.png" style="z-index: 0;" alt="Welcome Background">
        </div>

        <div class="container-form_registration">
            <div class="container-text-registration">
                <div class="text-registration" style="font-size: 32px; font-weight: 600;" id="form-title">Регистрация</div>
                <div class="subtext-fill_all_fields" id="form-subtitle">Заполните поля ниже, чтобы создать аккаунт</div>
            </div>
            <form action="/submit" method="post">
                <div class="enter-username">
                    <label for="name">Имя пользователя</label>
                    <input type="text" id="name" name="username" placeholder="Иван" required>
                </div>
                
                <div class="create-password">
                    <label for="password">Пароль</label>
                    <input type="password" id="password" name="userpassword" placeholder="Придумайте пароль" required>
                </div>

                <div class="enter-invitation-code" id="id-input-invite-code">
                    <label for="invitation_code">Код приглашения</label>
                    <input type="text" id="invitation_code" name="invitation_code" placeholder="Введите код" required>
                </div>

                <a href="../general/tasks.html" class="link-reg">
                    <button type="button" class="button_register" id="submit-btn">Зарегистрироваться</button>
                </a>

                <div class="text-link_if-have-acc" id="toggle-text">Уже есть аккаунт? <a href="" class="link_log-in" id="toggle-link">Войти</a></div>
            </form>
        </div>
    </div>
    <script type="module" src="../scripts/swap-forms.js"></script>
</body>
</html>
