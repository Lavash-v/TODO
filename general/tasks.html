<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Менеджер задач</title>
    <style>
        :root {
            --app-bg: #1A1A1A;
            --card-bg-subtle: #202020;
            --card-border: #777777;
            --neon-green: #84D431;
            --text-main: #E5E7EB;
            --text-muted: #9CA3AF;
            --priority-red: #FF0000;
            --priority-red-bg: #FF330033;
            --priority-yellow: #F4E115;
            --priority-yellow-bg: #F9DB3133;
            --priority-green: #84D431;
            --priority-green-bg: #84D43133;
        }

        @font-face {
            font-family: 'InterLocal';
            src: url("../fonts/Inter-VariableFont_opsz,wght.ttf");
            font-weight: 100 900;
            font-style: normal;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--app-bg);
            color: var(--text-main);
            font-family: 'InterLocal', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            user-select: none;
        }

        /* Кастомный скроллбар */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--app-bg);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--card-border);
            border-radius: 4px;
        }

        header {
            width: 100%;
            max-width: 1680px;
            margin: 60px auto 62px auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .exit-btn {
            background: none;
            border: none;
            cursor: pointer;
        }

        main {
            width: 100%;
            max-width: 1680px;
            margin: 0 auto;
            flex: 1;
            display: grid;
            grid-template-columns: 722px 926px;
            gap: 24px;
            align-items: start;
            margin-bottom: 80px;
            justify-content: center;
        }

        @media (max-width: 1024px) {
            main {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            position: relative;
            overflow: hidden;
            background: linear-gradient(to top, #1A1A1A, #262626);
            border: 1px solid #77777780;
            border-radius: 20px;
            padding: 32px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            min-height: 822px;
        }

        /* Верхнее зелёное свечение */
        .panel::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 85%;
            height: 130px;
            background: radial-gradient(ellipse at 50% 0%, rgba(132, 204, 22, 0.12) 0%, transparent 75%);
            pointer-events: none;
            z-index: 1;
        }

        .panel > * {
            position: relative;
            z-index: 2;
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }

        .panel-title {
            font-size: 32px;
            font-weight: 600;
            color: #FFFFFF;
            letter-spacing: -0.025em;
        }

        .btn-primary {
            background-color: var(--neon-green);
            color: #000000;
            font-weight: 600;
            font-size: 14px;
            padding: 10px 16px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(135, 234, 27, 0.2);
            width: 190px;
            height: 54px;
        }
        .btn-primary:hover {
            opacity: 0.8;
        }
        .btn-primary:active {
            transform: scale(0.98);
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            gap: 20px;
            color: var(--text-muted);
        }

        .empty-state-text {
            font-size: 32px;
            color: #FFFFFF;
            font-weight: 500;
        }

        .tasks-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
            flex: 1;
            overflow-y: auto;
            padding-right: 4px;
        }

        .task-card {
            width: 100%;
            max-height: 80px;
            padding: 16px;
            border-radius: 8px;
            background-color: var(--card-bg-subtle);
            border: 1px solid var(--card-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: all 0.2s;
        }
        .task-card:hover {
            opacity: 0.8;
        }
        .task-card.selected {
            border-color: var(--neon-green);
            background-color: var(--card-bg-subtle);
        }
        .task-card.completed {
            opacity: 0.4;
        }
        .task-card.completed:hover {
            opacity: 0.7;
        }

        .task-info {
            display: flex;
            align-items: flex-start;
            gap: 14px;
        }

        .custom-checkbox {
            width: 20px;
            height: 20px;
            border-radius: 2px;
            border: 1px solid var(--card-border);
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            margin-top: 2px;
            transition: border-color 0.2s;
        }
        .custom-checkbox:hover {
            opacity: 0.8;
        }
        .task-card.completed .custom-checkbox {
            border-color: var(--card-border);
            color: var(--card-border);
        }

        .task-title {
            font-weight: 500;
            font-size: 16px;
            color: #FFFFFF;
            line-height: 1.4;
        }
        .task-card.completed .task-title {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        .priority-badge {
            display: inline-block;
            margin-top: 8px;
            padding: 6px;
            border-radius: 2px;
            font-size: 8px;
            font-weight: 500;
            width: 91px;
            height: 22px;
        }
        .badge-red { background-color: var(--priority-red-bg); color: var(--priority-red); }
        .badge-yellow { background-color: var(--priority-yellow-bg); color: var(--priority-yellow); }
        .badge-green { background-color: var(--priority-green-bg); color: var(--priority-green); }

        .task-assignee {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .editor-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }

        .editor-title-input {
            background: transparent;
            font-size: 32px;
            font-weight: 600;
            color: #FFFFFF;
            border: none;
            border-bottom: 1px solid transparent;
            outline: none;
            width: 100%;
            margin-right: 16px;
            padding: 4px 0;
            transition: border-color 0.2s;
        }
        .editor-title-input:focus {
            border-color: var(--card-border);
        }

        .editor-actions {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .editor-action-btn {
            background: none;
            border: none;
            color: inherit;
            cursor: pointer;
            transition: color 0.2s;
        }

        .icon-edit {
            fill: var(--card-border);
        }
        .icon-edit:hover {
            fill: var(--neon-green);
        }

        .icon-delete {
            fill: var(--card-border);
        }
        .icon-delete:hover {
            fill: var(--priority-red);
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 24px;
        }

        .form-group {
            position: relative;
        }

        .form-label {
            display: block;
            font-size: 16px;
            color: #FFFFFF;
            margin-bottom: 6px;
            font-weight: 400;
        }

        .dropdown-btn {
            width: 100%;
            background-color: var(--card-bg-subtle);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 12px 16px;
            text-align: left;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: var(--text-main);
            font-size: 14px;
            cursor: pointer;
            transition: border-color 0.2s;
        }
        .dropdown-btn:hover {
            opacity: 0.8;
        }

        .dropdown-menu {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            margin-top: 8px;
            background-color: #202020;
            border: 1px solid var(--card-border);
            border-radius: 8px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.7);
            z-index: 20;
            padding: 6px 0;
        }
        .dropdown-menu.show {
            display: block;
        }

        .dropdown-item {
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            cursor: pointer;
            color: var(--text-main);
            transition: background-color 0.2s;
        }
        .dropdown-item:hover {
            background-color: var(--card-bg-subtle);
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
        }
        .dot-red { background-color: var(--priority-red); }
        .dot-yellow { background-color: var(--priority-yellow); }
        .dot-green { background-color: var(--priority-green); }

        .subitems-container {
            margin-bottom: 24px;
        }

        .subitem-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(42, 44, 48, 0.6);
        }
        .subitem-row:last-child {
            border-bottom: none;
        }

        .subitem-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .drag-handle {
            display: flex;
            flex-direction: column;
            gap: 2px;
            cursor: grab;
            padding: 0 2px;
        }
        .drag-dot-row {
            display: flex;
            gap: 2px;
        }
        .drag-dot {
            width: 2px;
            height: 2px;
            background-color: var(--card-border);
            border-radius: 50%;
        }

        .subitem-title {
            font-size: 14px;
            color: #E5E7EB;
        }
        .subitem-title.completed {
            text-decoration: line-through;
            color: #6B7280;
        }

        .subitem-remove {
            background: none;
            border: none;
            color: var(--card-border);
            cursor: pointer;
            font-size: 14px;
            padding: 4px 8px;
            transition: color 0.2s;
        }
        .subitem-remove:hover {
            color: var(--priority-red);
        }

        .add-subitem-box {
            border: 2px solid var(--card-border);
            border-radius: 8px;
            background-color: var(--card-bg-subtle);
            margin-top: 56px;
        }

        .add-subitem-trigger {
            width: 100%;
            background: none;
            border: none;
            padding: 12px 16px;
            color: #D1D5DB;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            height: 58px;
        }

        .add-subitem-form {
            display: none;
            align-items: center;
            padding: 6px 12px;
            height: 58px;
        }
        .add-subitem-form.show {
            display: flex;
        }

        .subitem-input {
            width: 100%;
            background: transparent;
            border: none;
            color: #FFFFFF;
            font-size: 14px;
            outline: none;
            padding: 6px 0;
        }

        .subitem-ok-btn {
            background: none;
            border: none;
            color: var(--neon-green);
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            padding: 4px 8px;
        }

        .editor-footer {
            display: flex;
            gap: 16px;
            margin-top: auto;
            padding-top: 16px;
        }

        .btn-save {
            flex: 1;
            background-color: var(--neon-green);
            color: #000000;
            font-weight: 600;
            padding: 14px 24px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.2s;
            box-shadow: 0 4px 12px rgba(135, 234, 27, 0.2);
            max-width: 258px;
            height: 67px;
        }
        .btn-save:hover {
            opacity: 0.8;
        }

        .btn-cancel {
            flex: 1;
            background-color: var(--card-bg-subtle);
            border: 2px solid var(--card-border);
            color: #E5E7EB;
            font-weight: 600;
            padding: 14px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            max-width: 178px;
        }
        .btn-cancel:hover {
            opacity: 0.8;
        }

        .hidden {
            display: none !important;
        }
        .rotate {
            transform: rotate(180deg);
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.75);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.show {
            display: flex;
        }

        .modal-card {
            width: 580px;
            height: 380px;
            background: linear-gradient(to top, #1A1A1A, #262626);
            border: 1px solid var(--neon-green);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            position: relative;
            overflow: hidden;
        }
        .modal-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 85%;
            height: 100px;
            background: radial-gradient(ellipse at 50% 0%, rgba(132, 204, 22, 0.15) 0%, transparent 75%);
            pointer-events: none;
        }

        .modal-title {
            font-size: 32px;
            font-weight: 600;
            color: #FFFFFF;
            margin-bottom: 60px;
            z-index: 2;
        }

        .modal-actions {
            display: flex;
            gap: 20px;
            width: 100%;
            max-width: 460px;
            z-index: 2;
        }

        .btn-modal-confirm {
            flex: 1;
            background-color: var(--neon-green);
            color: #000000;
            font-weight: 600;
            font-size: 16px;
            height: 60px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(132, 204, 22, 0.3);
        }
        .btn-modal-confirm:hover {
            opacity: 0.9;
        }

        .btn-modal-cancel {
            flex: 1;
            background-color: var(--card-bg-subtle);
            border: 2px solid var(--card-border);
            color: #FFFFFF;
            font-weight: 600;
            font-size: 16px;
            height: 60px;
            border-radius: 10px;
            cursor: pointer;
        }
        .btn-modal-cancel:hover {
            opacity: 0.9;
        }
    </style>
</head>

    </header>

    <main>
        <section class="panel">
            <div class="panel-header">
                <h2 class="panel-title">Наши задачи</h2>
                <button class="btn-primary" id="btn-new-task">
                    <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M13.5 9H9M9 9H4.5M9 9V4.5M9 9V13.5" stroke="black" stroke-width="1.125" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg> Новая задача
                </button>
            </div>
            <div id="tasks-container" class="tasks-list">
            </div>
        </section>

        <section id="editor-panel" class="panel">
            <div id="editor-content-wrapper">
                <div class="editor-top">
                    <input type="text" id="editor-title" class="editor-title-input" value="">
                    <div class="editor-actions">
                        <button class="editor-action-btn" onclick="focusTitle()" title="Редактировать">
                            <svg width="40" height="40" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" class="icon-edit">

                            </svg>
                        </button>
                        <button class="editor-action-btn delete" onclick="confirmDeleteTask()" title="Удалить">
                            <svg width="40" height="40" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" class="icon-delete">

                            </svg>
                        </button>
                    </div>
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label class="form-label">Приоритет</label>
                        <button id="priority-dropdown-btn" class="dropdown-btn" onclick="togglePriorityMenu()">
                            <span id="selected-priority-label" style="display: flex; align-items: center; gap: 8px;">
                                <span class="dot dot-yellow"></span> Средний
                            </span>
                            <span id="priority-arrow" style="font-size: 10px; color: var(--text-muted); transition: transform 0.2s;">▼</span>
                        </button>
                        <div id="priority-menu" class="dropdown-menu">
                            <div class="dropdown-item" onclick="selectPriority('low')">
                                <span class="dot dot-green"></span> Низкий
                            </div>
                            <div class="dropdown-item" onclick="selectPriority('medium')">
                                <span class="dot dot-yellow"></span> Средний
                            </div>
                            <div class="dropdown-item" onclick="selectPriority('high')">
                                <span class="dot dot-red"></span> Высокий
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Кому</label>
                        <div class="dropdown-btn" style="cursor: default;">
                            <span style="display: flex; align-items: center; gap: 8px;">
                                <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M8.23091 8.75666C7.74369 8.26888 7.50008 7.67916 7.50008 6.98749C7.50008 6.29582 7.74369 5.7061 8.23091 5.21832C8.71814 4.73054 9.30786 4.48693 10.0001 4.48749C10.6923 4.48804 11.282 4.73166 11.7692 5.21832C12.2565 5.70499 12.5001 6.29471 12.5001 6.98749C12.5001 7.68027 12.2565 8.26999 11.7692 8.75666C11.282 9.24332 10.6923 9.48693 10.0001 9.48749C9.30786 9.48804 8.71814 9.24443 8.23091 8.75666ZM4.16675 14.6475V14.1408C4.16675 13.7969 4.26675 13.4753 4.46675 13.1758C4.6673 12.8758 4.93675 12.643 5.27508 12.4775C6.06175 12.1003 6.84897 11.8175 7.63675 11.6292C8.42397 11.4403 9.21175 11.3458 10.0001 11.3458C10.7884 11.3458 11.5765 11.4403 12.3642 11.6292C13.152 11.818 13.9387 12.1008 14.7242 12.4775C15.0631 12.643 15.3326 12.8758 15.5326 13.1758C15.7331 13.4753 15.8334 13.7969 15.8334 14.1408V14.6475C15.8334 14.8919 15.7504 15.0975 15.5842 15.2642C15.4181 15.4297 15.2126 15.5125 14.9676 15.5125H5.03341C4.78841 15.5125 4.58286 15.4294 4.41675 15.2633C4.25064 15.0972 4.1673 14.8919 4.16675 14.6475Z" fill="white"/>
                                </svg>Себе
                            </span>
                            <span style="font-size: 10px; color: var(--text-muted);">▼</span>
                        </div>
                    </div>
                </div>

                <div class="subitems-container">
                    <div id="subitems-list">
                    </div>

                    <div class="add-subitem-box">
                        <button id="add-subitem-trigger-btn" class="add-subitem-trigger" onclick="showSubitemInput()">
                            <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M13.5 9H9M9 9H4.5M9 9V4.5M9 9V13.5" stroke="white" stroke-width="1.125" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg> Добавить подпункт
                        </button>
                        <form id="add-subitem-form" class="add-subitem-form" onsubmit="addSubitem(event)">
                            <input type="text" id="new-subitem-input" class="subitem-input" placeholder="Введите название подпункта...">
                            <button type="submit" class="subitem-ok-btn">ОК</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="editor-footer">
                <button class="btn-save" onclick="saveTask()">Сохранить задачу</button>
                <button class="btn-cancel" onclick="cancelEdits()">Отмена</button>
            </div>
          </div>
        </section>
    </main>

    <div id="modal-overlay" class="modal-overlay">
        <div class="modal-card">
            <h3 id="modal-title" class="modal-title">Удалить задачу?</h3>
            <div class="modal-actions">
                <button id="modal-confirm-btn" class="btn-modal-confirm">Удалить</button>
                <button class="btn-modal-cancel" onclick="closeModal()">Отмена</button>
            </div>
        </div>
    </div>
<script type="module" src="../scripts/app.js"></script>
</body>
</html>
